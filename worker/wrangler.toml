name = "leselog-transcribe"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Secrets (nicht hier eintragen, sondern per CLI setzen):
#   wrangler secret put ELEVENLABS_API_KEY      (für Scribe)
#   wrangler secret put OPENAI_API_KEY          (falls PROVIDER=openai)
[vars]
PROVIDER = "elevenlabs"          # "elevenlabs" (Scribe) oder "openai" (Whisper)
LANGUAGE = "de"
# Erlaubte Web-App-Herkunft(e) für CORS, kommagetrennt. Nach dem Deploy anpassen.
ALLOWED_ORIGINS = "*"
